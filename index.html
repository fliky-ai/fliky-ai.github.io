here<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e16">
<title>Gold Miner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0a0e16; --panel:#121826; --raised:#1a2236; --line:#26304a;
  --txt:#eaeef8; --mut:#7f8cab;
  --gold:#ffb627; --gold-d:#e08a00; --ember:#ff6b3d; --crystal:#4de1d0; --red:#ff5d6c;
  --safe-top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
  --safe-bot: var(--tg-safe-area-inset-bottom, 0px);
  --display:'Unbounded','Manrope',system-ui,sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ink);color:var(--txt);font-family:var(--body);overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  background:
    radial-gradient(900px 500px at 50% -10%, rgba(255,182,39,.10), transparent 60%),
    radial-gradient(600px 400px at 100% 100%, rgba(77,225,208,.06), transparent 60%),
    var(--ink);}
button,input{font-family:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.nosel{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

/* ── шапка ── */
header{padding:calc(var(--safe-top) + 12px) 16px 10px;display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;
  font-family:var(--display);font-weight:700;font-size:16px;color:#2a1700;
  background:linear-gradient(145deg,#ffd36b,var(--gold-d));box-shadow:0 4px 14px rgba(255,182,39,.25)}
.who{min-width:0;flex:1}
.who b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12px;color:var(--crystal);font-weight:600}
.bal{text-align:right}
.bal strong{display:block;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1;color:var(--gold);
  text-shadow:0 0 24px rgba(255,182,39,.35);font-variant-numeric:tabular-nums}
.bal small{font-size:11px;color:var(--mut);font-weight:600}

/* ── страницы ── */
main{flex:1;min-height:0;position:relative}
.page{position:absolute;inset:0;display:none;overflow-y:auto;overflow-x:hidden;padding:6px 16px 16px;-webkit-overflow-scrolling:touch}
.page.active{display:block}
#page-chat.active{display:flex;flex-direction:column;padding-bottom:0}
h2{font-family:var(--display);font-weight:700;font-size:18px;margin:4px 0 12px}

/* ── кликер ── */
.tap-zone{position:relative;display:flex;flex-direction:column;align-items:center;padding:14px 0 6px}
.coin{position:relative;width:min(64vw,270px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  touch-action:manipulation;transition:transform .08s ease-out;
  background:
    radial-gradient(circle at 32% 26%, #fff1b8 0, #ffd05a 22%, #f0a30f 52%, #b86a00 100%);
  box-shadow:
    inset 0 -10px 22px rgba(120,60,0,.55), inset 0 8px 16px rgba(255,255,255,.45),
    0 0 0 8px rgba(255,182,39,.10), 0 0 0 16px rgba(255,182,39,.05),
    0 24px 60px rgba(255,150,0,.30);}
.coin::before{content:"";position:absolute;inset:11%;border-radius:50%;
  border:3px dashed rgba(120,60,0,.35);box-shadow:inset 0 2px 6px rgba(255,255,255,.25)}
.coin span{font-size:min(26vw,110px);filter:drop-shadow(0 4px 4px rgba(90,40,0,.45));transform:rotate(-12deg)}
.coin.hit{transform:scale(.955)}
.tap-info{margin-top:18px;font-size:13px;color:var(--mut);font-weight:600}
.tap-info b{color:var(--txt)}
.float{position:fixed;pointer-events:none;z-index:50;font-family:var(--display);font-weight:800;font-size:22px;color:#fff3c4;
  text-shadow:0 2px 10px rgba(255,150,0,.8);animation:floatUp .9s ease-out forwards}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-90px)}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.card .t{font-weight:700;font-size:14px}
.card .d{font-size:12px;color:var(--mut);margin-top:2px;line-height:1.35}
.btn{padding:10px 14px;border-radius:12px;font-weight:800;font-size:13px;white-space:nowrap;
  background:var(--raised);color:var(--mut);border:1px solid var(--line);transition:transform .1s, background .2s}
.btn.can{background:linear-gradient(145deg,#ffcc4d,var(--gold-d));color:#2a1700;border-color:transparent;box-shadow:0 6px 16px rgba(255,160,0,.25)}
.btn:active{transform:scale(.95)}
.btn small{display:block;font-size:11px;font-weight:700;opacity:.85}

/* ── шахты ── */
.mines{display:flex;flex-direction:column;gap:10px}
.mine{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px}
.mine.owned{border-color:rgba(77,225,208,.35);background:linear-gradient(180deg,rgba(77,225,208,.06),var(--panel))}
.mine .ico{width:48px;height:48px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:24px;background:var(--raised)}
.mine .lvl{font-size:11px;font-weight:800;color:var(--crystal);margin-left:6px}
.mine .inc{font-size:12px;color:var(--mut);margin-top:3px}
.mine .inc em{font-style:normal;color:var(--crystal);font-weight:700}

/* ── топ ── */
.top{display:flex;flex-direction:column;gap:8px}
.place{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.place.me{border-color:var(--gold);box-shadow:0 0 0 1px rgba(255,182,39,.25) inset}
.place .rk{width:30px;text-align:center;font-family:var(--display);font-weight:700;font-size:14px;color:var(--mut)}
.place:nth-child(1) .rk,.place:nth-child(2) .rk,.place:nth-child(3) .rk{font-size:22px}
.place .av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#08111a}
.place .nm{flex:1;min-width:0;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.place .sc{font-family:var(--display);font-weight:700;font-size:13px;color:var(--gold)}
.myrank{margin-top:12px;text-align:center;font-size:13px;color:var(--mut);font-weight:600}
.myrank b{color:var(--gold)}
.empty{text-align:center;color:var(--mut);font-size:13px;padding:30px 0}

/* ── чат ── */
.msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 0 10px}
.msg{max-width:84%;padding:8px 12px 7px;border-radius:16px;background:var(--panel);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:5px}
.msg.mine{align-self:flex-end;background:linear-gradient(145deg,#2a3556,#212b47);border-color:#34406a;border-bottom-left-radius:16px;border-bottom-right-radius:5px}
.msg .who2{font-size:12px;font-weight:800;margin-bottom:2px}
.msg .tx{font-size:14px;line-height:1.35;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap}
.msg .tm{font-size:10px;color:var(--mut);text-align:right;margin-top:2px}
.composer{display:flex;gap:8px;padding:10px 0 12px;border-top:1px solid var(--line);background:var(--ink)}
.composer input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;outline:none}
.composer input:focus{border-color:var(--gold)}
.send{width:46px;border-radius:14px;background:linear-gradient(145deg,#ffcc4d,var(--gold-d));color:#2a1700;font-size:18px;font-weight:800}
.send:disabled{opacity:.5}

/* ── нижняя навигация ── */
nav{display:flex;gap:4px;padding:8px 10px calc(var(--safe-bot) + 10px);background:rgba(10,14,22,.92);border-top:1px solid var(--line);backdrop-filter:blur(10px)}
nav button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:14px;color:var(--mut);font-size:11px;font-weight:700;transition:color .2s, background .2s}
nav button i{font-style:normal;font-size:20px;filter:grayscale(1) opacity(.7);transition:filter .2s}
nav button.active{color:var(--gold);background:rgba(255,182,39,.10)}
nav button.active i{filter:none}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:none;place-items:center}
.badge.show{display:grid}

/* ── прочее ── */
#toast{position:fixed;left:50%;top:calc(var(--safe-top) + 70px);transform:translate(-50%,-20px);opacity:0;z-index:100;
  background:var(--raised);border:1px solid var(--line);padding:10px 16px;border-radius:14px;font-size:13px;font-weight:700;
  max-width:88vw;text-align:center;transition:opacity .2s, transform .2s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{border-color:var(--red);color:#ffc9ce}
#toast.ok{border-color:var(--crystal);color:#c9fff9}
#splash{position:fixed;inset:0;z-index:200;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px}
#splash .big{font-size:54px;animation:swing 1.2s ease-in-out infinite;transform-origin:70% 90%}
@keyframes swing{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
#splash p{color:var(--mut);font-size:14px;font-weight:600;line-height:1.5;max-width:300px}
#splash .btn{margin-top:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="splash">
  <div class="big">⛏️</div>
  <p id="splashText">Спускаемся в шахту…</p>
  <button class="btn can" id="retry" style="display:none">Попробовать снова</button>
</div>

<header>
  <div class="avatar" id="avatar">?</div>
  <div class="who"><b id="uname">Игрок</b><span id="incomeTop">+0 в секунду</span></div>
  <div class="bal"><strong id="balance">0</strong><small>монет</small></div>
</header>

<main>
  <!-- КЛИК -->
  <section class="page active" id="page-click">
    <div class="tap-zone">
      <div class="coin nosel" id="coin"><span>⛏️</span></div>
      <div class="tap-info">За один тап: <b id="power">+1</b></div>
    </div>
    <div class="card row" style="margin-top:14px">
      <div class="grow">
        <div class="t">Крепкая кирка</div>
        <div class="d">Уровень <b id="clickLvl">1</b>. Каждый тап приносит на 1 монету больше.</div>
      </div>
      <button class="btn" id="clickUp"><span>Улучшить</span><small id="clickCost">100</small></button>
    </div>
  </section>

  <!-- ШАХТЫ -->
  <section class="page" id="page-mines">
    <h2>Шахты</h2>
    <div class="mines" id="minesList"></div>
  </section>

  <!-- ТОП -->
  <section class="page" id="page-top">
    <h2>ТОП-10 игроков</h2>
    <div class="top" id="topList"><div class="empty">Загружаем рейтинг…</div></div>
    <div class="myrank" id="myRank"></div>
  </section>

  <!-- ЧАТ -->
  <section class="page" id="page-chat">
    <h2>Общий чат</h2>
    <div class="msgs" id="msgs"><div class="empty" id="chatEmpty">Пока тихо. Напишите первым!</div></div>
    <div class="composer">
      <input id="chatInput" type="text" maxlength="300" placeholder="Сообщение…" autocomplete="off" enterkeyhint="send">
      <button class="send" id="sendBtn" aria-label="Отправить">➤</button>
    </div>
  </section>
</main>

<nav>
  <button data-page="click" class="active"><i>💰</i>Клик</button>
  <button data-page="mines"><i>🏭</i>Шахты</button>
  <button data-page="top"><i>🏆</i>ТОП</button>
  <button data-page="chat"><i>💬</i>Чат<span class="badge" id="chatBadge">0</span></button>
</nav>

<div id="toast"></div>

<script>
/* ═════════ НАСТРОЙКИ ═════════ */
const API = "https://ahgsraow97.apps.bot-hosting.cloud";   // адрес bot.py на хостинге

/* ═════════ TELEGRAM ═════════ */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  try { if (["android","ios"].includes(tg.platform) && tg.isVersionAtLeast("8.0") && !tg.isFullscreen) tg.requestFullscreen(); } catch(e){}
  try { tg.disableVerticalSwipes(); } catch(e){}
  try { tg.setHeaderColor("#0a0e16"); tg.setBackgroundColor("#0a0e16"); tg.setBottomBarColor("#0a0e16"); } catch(e){}
}
const initData = tg ? tg.initData : "";
const haptic = (kind="light") => { try { tg.HapticFeedback.impactOccurred(kind); } catch(e){} };
const notify = (kind) => { try { tg.HapticFeedback.notificationOccurred(kind); } catch(e){} };

/* ═════════ УТИЛИТЫ ═════════ */
const $ = (id) => document.getElementById(id);
const SUF = ["","K","M","B","T","Qa","Qi","Sx"];
function fmt(n){
  n = Math.floor(n);
  if (n < 1000) return String(n);
  const i = Math.min(Math.floor(Math.log10(n)/3), SUF.length-1);
  const v = n / Math.pow(1000, i);
  return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : v.toFixed(0)) + SUF[i];
}
function fmtRate(n){ return n < 1000 ? String(Math.round(n*10)/10) : fmt(n); }
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const COLORS = ["#ffb627","#4de1d0","#ff6b3d","#8ab4ff","#c79bff","#7be495","#ff8fb1","#ffd36b"];
const colorOf = (id) => COLORS[Math.abs(Number(id)) % COLORS.length];
const initial = (name) => (name || "?").trim().charAt(0).toUpperCase() || "?";

let toastTimer;
function toast(text, kind=""){
  const t = $("toast");
  t.textContent = text; t.className = "show " + kind;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = "", 2200);
}

async function api(path, body){
  const opts = { method: body === undefined ? "GET" : "POST", headers: { "Authorization": "tma " + initData } };
  if (body !== undefined){ opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const res = await fetch(API + path, opts);
  let data = {};
  try { data = await res.json(); } catch(e){}
  if (!res.ok || data.ok === false){
    const err = new Error(data.error || ("HTTP " + res.status));
    err.status = res.status;
    throw err;
  }
  return data;
}

/* ═════════ СОСТОЯНИЕ ═════════ */
let state = null;       // balance, income, click_power, click_cost, mines[]
let me = null;          // {id, name}
let pending = 0;        // тапы, ещё не отправленные на сервер
let syncing = false;
let lastSync = 0;

/* ═════════ ОТРИСОВКА ═════════ */
function renderBalance(){
  $("balance").textContent = fmt(state.balance);
}
function renderStatic(){
  $("incomeTop").textContent = "+" + fmtRate(state.income) + " в секунду";
  $("power").textContent = "+" + state.click_power;
  $("clickLvl").textContent = state.click_power;
  $("clickCost").textContent = fmt(state.click_cost);
  renderBalance();
  updateAffordable();
}
function updateAffordable(){
  const bal = state.balance;
  $("clickUp").classList.toggle("can", bal >= state.click_cost);
  document.querySelectorAll("#minesList .btn").forEach(b => {
    b.classList.toggle("can", bal >= Number(b.dataset.cost));
  });
}
function renderMines(){
  const box = $("minesList");
  box.innerHTML = "";
  state.mines.forEach(m => {
    const el = document.createElement("div");
    el.className = "mine" + (m.level > 0 ? " owned" : "");
    el.innerHTML = `
      <div class="ico"></div>
      <div class="grow">
        <div class="t"><span class="nm"></span><span class="lvl"></span></div>
        <div class="inc"></div>
      </div>
      <button class="btn" data-id="${m.id}" data-cost="${m.next_cost}"><span></span><small></small></button>`;
    el.querySelector(".ico").textContent = m.emoji;
    el.querySelector(".nm").textContent = m.name;
    el.querySelector(".lvl").textContent = m.level > 0 ? "ур. " + m.level : "";
    el.querySelector(".inc").innerHTML = m.level > 0
      ? `Даёт <em>+${fmtRate(m.income)}/сек</em>, после улучшения <em>+${fmtRate(m.next_income)}/сек</em>`
      : `После покупки даст <em>+${fmtRate(m.next_income)}/сек</em>`;
    el.querySelector(".btn span").textContent = m.level > 0 ? "Улучшить" : "Купить";
    el.querySelector(".btn small").textContent = fmt(m.next_cost);
    box.appendChild(el);
  });
  updateAffordable();
}
function applyState(r){
  state = { ...state, ...r };
  state.balance = r.balance + pending * r.click_power;
  renderStatic();
  if (r.mines) renderMines();
}

/* ═════════ КЛИК ═════════ */
const coin = $("coin");
let floats = 0;
function tap(e){
  if (!state) return;
  e.preventDefault();
  pending++;
  state.balance += state.click_power;
  renderBalance();
  haptic("light");
  coin.classList.add("hit");
  setTimeout(() => coin.classList.remove("hit"), 70);
  if (floats < 24){
    floats++;
    const f = document.createElement("div");
    f.className = "float";
    f.textContent = "+" + state.click_power;
    f.style.left = (e.clientX + (Math.random()*30-15)) + "px";
    f.style.top = (e.clientY - 20) + "px";
    f.addEventListener("animationend", () => { f.remove(); floats--; });
    document.body.appendChild(f);
  }
}
coin.addEventListener("pointerdown", tap);
coin.addEventListener("contextmenu", e => e.preventDefault());

/* ═════════ СИНХРОНИЗАЦИЯ ═════════ */
async function sync(){
  if (syncing || !state) return;
  syncing = true;
  const sent = pending;
  pending = 0;
  try {
    const r = await api("/api/sync", { taps: sent });
    applyState(r);
  } catch(e){
    pending += sent;
    if (e.status === 401) showFatal("Сессия устарела. Закройте игру и откройте её заново через бота.");
  } finally {
    syncing = false;
    lastSync = Date.now();
  }
}
async function flush(){
  while (syncing) await sleep(30);
  await sync();
}
setInterval(() => { if (state && (pending > 0 || Date.now() - lastSync > 10000)) sync(); }, 2500);
document.addEventListener("visibilitychange", () => { if (document.hidden) sync(); });

/* пассивный доход тикает на экране 10 раз в секунду */
setInterval(() => {
  if (!state || !state.income) return;
  state.balance += state.income / 10;
  renderBalance();
  updateAffordable();
}, 100);

/* ═════════ ПОКУПКИ ═════════ */
let buying = false;
async function purchase(path, body){
  if (buying) return;
  buying = true;
  try {
    await flush();
    const r = await api(path, body);
    applyState(r);
    notify("success");
    toast("Готово!", "ok");
  } catch(e){
    notify("error");
    toast(e.message, "err");
  } finally { buying = false; }
}
$("clickUp").addEventListener("click", () => purchase("/api/upgrade_click", {}));
$("minesList").addEventListener("click", (e) => {
  const b = e.target.closest(".btn");
  if (b) purchase("/api/buy", { mine_id: Number(b.dataset.id) });
});

/* ═════════ ТОП ═════════ */
async function loadTop(){
  try {
    await flush();
    const r = await api("/api/top");
    const box = $("topList");
    box.innerHTML = "";
    if (!r.top.length) box.innerHTML = '<div class="empty">Пока нет игроков</div>';
    const medals = ["🥇","🥈","🥉"];
    r.top.forEach((p, i) => {
      const row = document.createElement("div");
      row.className = "place" + (me && p.id === me.id ? " me" : "");
      row.innerHTML = '<div class="rk"></div><div class="av"></div><div class="nm"></div><div class="sc"></div>';
      row.querySelector(".rk").textContent = medals[i] || (i + 1);
      const av = row.querySelector(".av");
      av.textContent = initial(p.name); av.style.background = colorOf(p.id);
      row.querySelector(".nm").textContent = p.name;
      row.querySelector(".sc").textContent = fmt(p.balance);
      box.appendChild(row);
    });
    $("myRank").innerHTML = `Ваше место: <b>#${r.me.rank}</b> из ${r.me.total}`;
  } catch(e){
    $("topList").innerHTML = '<div class="empty">Не удалось загрузить рейтинг</div>';
  }
}

/* ═════════ ЧАТ ═════════ */
const msgsBox = $("msgs");
const seen = new Set();
let lastId = 0, unread = 0, chatBusy = false, chatLoaded = false;

function timeOf(ts){
  const d = new Date(ts * 1000);
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function addMessages(list){
  const fresh = list.filter(m => !seen.has(m.id));
  if (!fresh.length) return 0;
  const nearBottom = msgsBox.scrollHeight - msgsBox.scrollTop - msgsBox.clientHeight < 120;
  const empty = $("chatEmpty"); if (empty) empty.remove();
  let fromOthers = 0;
  fresh.forEach(m => {
    seen.add(m.id);
    lastId = Math.max(lastId, m.id);
    const mine = me && m.tg_id === me.id;
    if (!mine) fromOthers++;
    const el = document.createElement("div");
    el.className = "msg" + (mine ? " mine" : "");
    el.innerHTML = '<div class="who2"></div><div class="tx"></div><div class="tm"></div>';
    const w = el.querySelector(".who2");
    w.textContent = mine ? "Вы" : m.name; w.style.color = colorOf(m.tg_id);
    el.querySelector(".tx").textContent = m.text;
    el.querySelector(".tm").textContent = timeOf(m.ts);
    msgsBox.appendChild(el);
  });
  if (nearBottom || !chatLoaded) msgsBox.scrollTop = msgsBox.scrollHeight;
  return fromOthers;
}
async function pollChat(){
  if (chatBusy || !state) return;
  chatBusy = true;
  try {
    const r = await api("/api/chat?after=" + lastId);
    const others = addMessages(r.messages);
    if (chatLoaded && others && currentPage !== "chat"){
      unread += others;
      const b = $("chatBadge"); b.textContent = unread > 99 ? "99+" : unread; b.classList.add("show");
    }
    chatLoaded = true;
  } catch(e){} finally { chatBusy = false; }
}
setInterval(pollChat, 2000);

async function sendChat(){
  const input = $("chatInput");
  const text = input.value.trim();
  if (!text) return;
  $("sendBtn").disabled = true;
  try {
    const r = await api("/api/chat", { text });
    input.value = "";
    addMessages([r.message]);
    msgsBox.scrollTop = msgsBox.scrollHeight;
  } catch(e){
    toast(e.message, "err");
  } finally {
    $("sendBtn").disabled = false;
    input.focus();
  }
}
$("sendBtn").addEventListener("click", sendChat);
$("chatInput").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); sendChat(); } });

/* ═════════ НАВИГАЦИЯ ═════════ */
let currentPage = "click";
let topTimer = null;
function go(page){
  currentPage = page;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.page === page));
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("active", p.id === "page-" + page));
  clearInterval(topTimer);
  if (page === "top"){ loadTop(); topTimer = setInterval(loadTop, 10000); }
  if (page === "chat"){
    unread = 0; $("chatBadge").classList.remove("show");
    pollChat();
    setTimeout(() => { msgsBox.scrollTop = msgsBox.scrollHeight; }, 30);
  }
  haptic("light");
}
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => go(b.dataset.page)));

/* ═════════ ЗАПУСК ═════════ */
function showFatal(text){
  $("splash").style.display = "flex";
  $("splashText").textContent = text;
  $("retry").style.display = "inline-block";
}
$("retry").addEventListener("click", () => location.reload());

async function start(){
  if (!initData){
    showFatal("Откройте игру через Telegram: нажмите «Играть» в боте.");
    $("retry").style.display = "none";
    return;
  }
  try {
    const r = await api("/api/init", {});
    me = r.me;
    state = { balance: 0, income: 0, click_power: 1, click_cost: 100, mines: [] };
    applyState(r);
    $("uname").textContent = me.name;
    $("avatar").textContent = initial(me.name);
    $("splash").style.display = "none";
    lastSync = Date.now();
    if (r.offline > 0) toast("Шахты принесли +" + fmt(r.offline) + " пока вас не было", "ok");
    pollChat();
  } catch(e){
    showFatal(e.status === 401
      ? "Не удалось войти. Закройте игру и откройте её заново через бота."
      : "Нет связи с сервером. Проверьте, что bot.py запущен, и попробуйте снова.");
  }
}
start();
</script>
