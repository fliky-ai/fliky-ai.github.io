<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Claude AI Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-primary: #FAF9F5;
            --bg-secondary: #F0EEE6;
            --bg-sidebar: #EBE8DE;
            --text-primary: #1E1E1E;
            --text-secondary: #66645E;
            --accent-orange: #D97706;
            --border-color: #E2DFD5;
            --chat-bubble-user: #E8E5DA;
            --chat-bubble-ai: transparent;
            --input-bg: #FFFFFF;
            --modal-overlay: rgba(0, 0, 0, 0.4);
        }

        body.dark-theme {
            --bg-primary: #181816;
            --bg-secondary: #22221F;
            --bg-sidebar: #1E1E1B;
            --text-primary: #ECEBE8;
            --text-secondary: #9E9D98;
            --accent-orange: #F59E0B;
            --border-color: #2D2D29;
            --chat-bubble-user: #2A2A26;
            --chat-bubble-ai: transparent;
            --input-bg: #22221F;
            --modal-overlay: rgba(0, 0, 0, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        #app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .sidebar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-overlay);
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .sidebar-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .sidebar {
            position: absolute;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background-color: var(--bg-sidebar);
            z-index: 20;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-right: 1px solid var(--border-color);
        }

        .sidebar.open {
            transform: translateX(280px);
        }

        .sidebar-header {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-weight: 500;
            cursor: pointer;
        }

        .sidebar-menu {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 6px;
            color: var(--text-primary);
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .menu-item:hover {
            background-color: var(--bg-secondary);
        }

        .sidebar-section-title {
            padding: 12px 16px 4px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .recent-chats {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px;
        }

        .chat-history-item {
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            margin-bottom: 2px;
        }

        .chat-history-item:hover, .chat-history-item.active {
            background-color: var(--bg-secondary);
        }

        .sidebar-user {
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--accent-orange);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .user-name {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        .top-navbar {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-primary);
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }

        .model-selector-container {
            position: relative;
        }

        .model-selector-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
        }

        .model-dropdown {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 8px;
            width: 220px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            display: none;
            z-index: 30;
            overflow: hidden;
        }

        .model-dropdown.show {
            display: block;
        }

        .model-option {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            cursor: pointer;
        }

        .model-option:hover {
            background-color: var(--bg-sidebar);
        }

        .model-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .badge-free { background: #10B981; color: #fff; }
        .badge-pro { background: var(--accent-orange); color: #fff; }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            line-height: 1.5;
            font-size: 15px;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--chat-bubble-user);
            padding: 10px 14px;
            border-radius: 16px 16px 2px 16px;
        }

        .message.assistant {
            align-self: flex-start;
            background-color: var(--chat-bubble-ai);
            width: 100%;
            max-width: 100%;
        }

        .message-image {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .chat-input-area {
            padding: 12px 16px;
            background-color: var(--bg-primary);
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 8px 12px;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .image-preview-container {
            display: none;
            padding: 8px 16px 0;
            position: relative;
        }

        .image-preview-container.active {
            display: block;
        }

        .preview-img {
            height: 60px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .remove-img-btn {
            position: absolute;
            top: 2px;
            left: 65px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            cursor: pointer;
        }

        textarea {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 15px;
            resize: none;
            max-height: 120px;
            line-height: 1.4;
            padding: 4px 0;
        }

        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-overlay);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 85%;
            max-width: 320px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
        }

        .modal-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: var(--accent-orange);
            color: white;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .close-modal-btn {
            margin-top: 8px;
            padding: 8px 20px;
            background-color: var(--accent-orange);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        #file-input {
            display: none;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" id="new-chat-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    New chat
                </button>
            </div>
            
            <nav class="sidebar-menu">
                <div class="menu-item" id="menu-chats">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    Chats
                </div>
                <div class="menu-item" id="menu-projects">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                    Projects
                </div>
                <div class="menu-item" id="menu-artifacts">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                    Artifacts
                </div>
            </nav>

            <div class="sidebar-section-title">Recent</div>
            <div class="recent-chats" id="recent-chats-list"></div>

            <div class="sidebar-user" id="user-profile-btn">
                <div class="user-avatar" id="sidebar-avatar">U</div>
                <div class="user-info">
                    <div class="user-name" id="sidebar-username">User</div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-navbar">
                <button class="icon-btn" id="burger-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                
                <div class="model-selector-container">
                    <button class="model-selector-btn" id="model-selector-btn">
                        <span id="current-model-name">Gemini 2.5 Flash</span>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>
                    
                    <div class="model-dropdown" id="model-dropdown">
                        <div class="model-option" data-model="gemini-2.5-flash">
                            <span>Gemini 2.5 Flash</span>
                            <span class="model-badge badge-free">Free</span>
                        </div>
                        <div class="model-option" data-model="sonnet-5">
                            <span>Sonnet 5</span>
                            <span class="model-badge badge-pro">Pro</span>
                        </div>
                        <div class="model-option" data-model="haiku-4.5">
                            <span>Haiku 4.5</span>
                            <span class="model-badge badge-pro">Pro</span>
                        </div>
                        <div class="model-option" data-model="opus-5">
                            <span>Opus 5</span>
                            <span class="model-badge badge-pro">Pro</span>
                        </div>
                        <div class="model-option" data-model="fable-5">
                            <span>Fable 5</span>
                            <span class="model-badge badge-pro">Pro</span>
                        </div>
                    </div>
                </div>

                <div style="width: 36px;"></div>
            </header>

            <div class="chat-messages" id="chat-messages"></div>

            <div class="image-preview-container" id="image-preview-container">
                <img src="" id="image-preview" class="preview-img">
                <button class="remove-img-btn" id="remove-img-btn">✕</button>
            </div>

            <div class="chat-input-area">
                <div class="input-wrapper">
                    <button class="icon-btn" id="attach-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </button>
                    <input type="file" id="file-input" accept="image/*">
                    
                    <textarea id="chat-textarea" rows="1" placeholder="Reply to Claude..."></textarea>
                    
                    <button class="icon-btn" id="mic-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                    </button>
                    <button class="icon-btn" id="send-btn" style="color: var(--accent-orange);">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </div>
        </main>

        <div class="modal-overlay" id="profile-modal">
            <div class="modal-card">
                <div class="modal-avatar" id="modal-avatar">U</div>
                <h3 id="modal-username">User Name</h3>
                <p style="font-size: 12px; color: var(--text-secondary);" id="modal-userid">ID: 00000000</p>
                <p style="font-size: 13px;" id="modal-role-status">Статус: Обычный пользователь</p>
                <button class="close-modal-btn" id="close-modal-btn">Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = "https://a48794-5d18.e.jrnm.app";
        const tg = window.Telegram?.WebApp;
        
        if (tg) {
            tg.ready();
            tg.expand();
            if (tg.colorScheme === 'dark') {
                document.body.classList.add('dark-theme');
            }
        }

        let currentUser = null;
        let currentChatId = null;
        let currentModel = "gemini-2.5-flash";
        let selectedBase64Image = null;

        const burgerBtn = document.getElementById('burger-btn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const modelSelectorBtn = document.getElementById('model-selector-btn');
        const modelDropdown = document.getElementById('model-dropdown');
        const newChatBtn = document.getElementById('new-chat-btn');
        const chatMessages = document.getElementById('chat-messages');
        const chatTextarea = document.getElementById('chat-textarea');
        const sendBtn = document.getElementById('send-btn');
        const attachBtn = document.getElementById('attach-btn');
        const fileInput = document.getElementById('file-input');
        const imagePreviewContainer = document.getElementById('image-preview-container');
        const imagePreview = document.getElementById('image-preview');
        const removeImgBtn = document.getElementById('remove-img-btn');
        const recentChatsList = document.getElementById('recent-chats-list');
        const userProfileBtn = document.getElementById('user-profile-btn');
        const profileModal = document.getElementById('profile-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');

        function initApp() {
            const tgData = tg?.initDataUnsafe?.user;
            currentUser = {
                id: tgData?.id || 8771009385,
                first_name: tgData?.first_name || "Даулет",
                username: tgData?.username || "dauletbr"
            };

            updateUserUI();
            authenticateUser();
            setupEventListeners();
        }

        function updateUserUI() {
            const firstLetter = currentUser.first_name ? currentUser.first_name.charAt(0).toUpperCase() : 'U';
            document.getElementById('sidebar-avatar').innerText = firstLetter;
            document.getElementById('sidebar-username').innerText = currentUser.first_name;
            document.getElementById('modal-avatar').innerText = firstLetter;
            document.getElementById('modal-username').innerText = currentUser.first_name + (currentUser.username ? ` (@${currentUser.username})` : '');
            document.getElementById('modal-userid').innerText = `ID: ${currentUser.id}`;
            document.getElementById('modal-role-status').innerText = (currentUser.id === 8771009385) ? "Статус: Создатель (Admin)" : "Статус: Обычный пользователь";
        }

        async function authenticateUser() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/auth`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentUser)
                });
                const data = await res.json();
                if (data.status === 'success') {
                    loadRecentChats();
                    createNewChat();
                }
            } catch (err) {
                console.error("Auth error:", err);
            }
        }

        function setupEventListeners() {
            burgerBtn.addEventListener('click', () => {
                sidebar.classList.add('open');
                sidebarOverlay.classList.add('active');
            });

            sidebarOverlay.addEventListener('click', () => {
                sidebar.classList.remove('open');
                sidebarOverlay.classList.remove('active');
            });

            modelSelectorBtn.addEventListener('click', () => {
                modelDropdown.classList.toggle('show');
            });

            document.querySelectorAll('.model-option').forEach(option => {
                option.addEventListener('click', () => {
                    const modelKey = option.getAttribute('data-model');
                    const isPaid = modelKey !== 'gemini-2.5-flash';
                    const isAdmin = currentUser.id === 8771009385;

                    if (isPaid && !isAdmin) {
                        alert('Платные модели доступны только по подписке!');
                    } else {
                        currentModel = modelKey;
                        document.getElementById('current-model-name').innerText = option.querySelector('span').innerText;
                    }
                    modelDropdown.classList.remove('show');
                });
            });

            newChatBtn.addEventListener('click', () => {
                createNewChat();
                sidebar.classList.remove('open');
                sidebarOverlay.classList.remove('active');
            });

            attachBtn.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        selectedBase64Image = evt.target.result;
                        imagePreview.src = selectedBase64Image;
                        imagePreviewContainer.classList.add('active');
                    };
                    reader.readAsDataURL(file);
                }
            });

            removeImgBtn.addEventListener('click', () => {
                selectedBase64Image = null;
                fileInput.value = '';
                imagePreviewContainer.classList.remove('active');
            });

            chatTextarea.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });

            sendBtn.addEventListener('click', sendMessage);

            chatTextarea.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            userProfileBtn.addEventListener('click', () => profileModal.classList.add('active'));
            closeModalBtn.addEventListener('click', () => profileModal.classList.remove('active'));
            
            document.getElementById('menu-chats').addEventListener('click', () => {
                sidebar.classList.remove('open');
                sidebarOverlay.classList.remove('active');
            });
            document.getElementById('menu-projects').addEventListener('click', () => alert('Раздел Projects в разработке'));
            document.getElementById('menu-artifacts').addEventListener('click', () => alert('Раздел Artifacts в разработке'));
        }

        async function createNewChat() {
            currentChatId = 'chat_' + Date.now();
            chatMessages.innerHTML = '';
            loadRecentChats();
        }

        async function loadRecentChats() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/chats?user_id=${currentUser.id}`);
                const chats = await res.json();
                recentChatsList.innerHTML = '';
                chats.forEach(chat => {
                    const div = document.createElement('div');
                    div.className = `chat-history-item ${chat.chat_id === currentChatId ? 'active' : ''}`;
                    div.innerText = chat.title || 'Новый чат';
                    div.addEventListener('click', () => loadChatHistory(chat.chat_id));
                    recentChatsList.appendChild(div);
                });
            } catch (err) {
                console.error("Load chats error:", err);
            }
        }

        async function loadChatHistory(chatId) {
            currentChatId = chatId;
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('active');
            try {
                const res = await fetch(`${API_BASE_URL}/api/messages?chat_id=${chatId}`);
                const messages = await res.json();
                chatMessages.innerHTML = '';
                messages.forEach(msg => {
                    appendMessage(msg.role, msg.content, msg.image_data);
                });
                loadRecentChats();
            } catch (err) {
                console.error("Load messages error:", err);
            }
        }

        function appendMessage(role, text, imageData = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;

            if (imageData) {
                const img = document.createElement('img');
                img.src = imageData;
                img.className = 'message-image';
                msgDiv.appendChild(img);
            }

            const textDiv = document.createElement('div');
            if (role === 'assistant') {
                textDiv.innerHTML = marked.parse(text);
            } else {
                textDiv.innerText = text;
            }
            msgDiv.appendChild(textDiv);

            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const text = chatTextarea.value.trim();
            if (!text && !selectedBase64Image) return;

            const sendText = text;
            const sendImg = selectedBase64Image;

            chatTextarea.value = '';
            chatTextarea.style.height = 'auto';
            selectedBase64Image = null;
            fileInput.value = '';
            imagePreviewContainer.classList.remove('active');

            appendMessage('user', sendText, sendImg);

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            loadingDiv.innerText = 'Claude печатает...';
            chatMessages.appendChild(loadingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const res = await fetch(`${API_BASE_URL}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: currentUser.id,
                        chat_id: currentChatId,
                        message: sendText,
                        image: sendImg,
                        model: currentModel
                    })
                });

                const data = await res.json();
                chatMessages.removeChild(loadingDiv);

                if (data.status === 'success') {
                    appendMessage('assistant', data.reply);
                    loadRecentChats();
                } else {
                    appendMessage('assistant', 'Ошибка: ' + data.detail);
                }
            } catch (err) {
                chatMessages.removeChild(loadingDiv);
                appendMessage('assistant', 'Ошибка соединения с сервером.');
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
