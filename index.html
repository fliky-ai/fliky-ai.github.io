<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Fliky</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* ========== ТЕМА ========== */
  :root {
    --bg-primary: #ffffff;
    --bg-secondary: #f6f6f6;
    --bg-chat: #ffffff;
    --bg-input: #f6f6f6;
    --bg-bubble-user: #e8e8e8;
    --bg-bubble-assistant: #f6f6f6;
    --text-primary: #1a1a1a;
    --text-secondary: #666666;
    --text-muted: #999999;
    --accent: #4a6cf7;
    --accent-hover: #3a5cd7;
    --border-color: #e5e5e5;
    --shadow: rgba(0,0,0,0.08);
    --radius: 16px;
    --radius-sm: 10px;
  }

  [data-theme="dark"] {
    --bg-primary: #1a1a1a;
    --bg-secondary: #2d2d2d;
    --bg-chat: #1a1a1a;
    --bg-input: #2d2d2d;
    --bg-bubble-user: #2d2d2d;
    --bg-bubble-assistant: #2d2d2d;
    --text-primary: #f0f0f0;
    --text-secondary: #aaaaaa;
    --text-muted: #777777;
    --border-color: #3d3d3d;
    --shadow: rgba(0,0,0,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 100%;
    position: relative;
  }

  /* ========== ВЕРХНЯЯ ПАНЕЛЬ ========== */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    padding-top: max(10px, env(safe-area-inset-top));
    background: var(--bg-primary);
    border-bottom: 1px solid var(--border-color);
    flex-shrink: 0;
    z-index: 10;
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .menu-btn {
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 8px 4px;
    border-radius: 8px;
  }
  .menu-btn:active { background: var(--bg-secondary); }
  .menu-btn span {
    display: block;
    width: 20px;
    height: 2px;
    background: var(--text-primary);
    border-radius: 2px;
    transition: 0.2s;
  }

  .logo {
    font-size: 18px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), #7c4dff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .logo-sub {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 400;
    -webkit-text-fill-color: var(--text-muted);
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .model-badge {
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    background: rgba(74,108,247,0.1);
    padding: 4px 12px;
    border-radius: 20px;
  }

  .avatar-small {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    overflow: hidden;
    cursor: pointer;
  }
  .avatar-small img { width: 100%; height: 100%; object-fit: cover; }

  /* ========== ЧАТ ========== */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 8px;
    background: var(--bg-chat);
    -webkit-overflow-scrolling: touch;
  }

  .welcome {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 12px;
    padding: 20px;
  }
  .welcome .icon {
    font-size: 48px;
  }
  .welcome h2 {
    font-size: 22px;
    font-weight: 600;
  }
  .welcome p {
    color: var(--text-secondary);
    font-size: 14px;
    max-width: 280px;
  }

  .message-row {
    display: flex;
    margin-bottom: 16px;
    animation: fadeUp 0.2s ease;
  }
  .message-row.user { justify-content: flex-end; }
  .message-row.assistant { justify-content: flex-start; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .bubble {
    max-width: 82%;
    padding: 10px 14px;
    font-size: 15px;
    line-height: 1.5;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .bubble.user {
    background: var(--bg-bubble-user);
    border-radius: var(--radius) var(--radius) 4px var(--radius);
  }
  .bubble.assistant {
    background: var(--bg-bubble-assistant);
    border-radius: var(--radius) var(--radius) var(--radius) 4px;
    border: 1px solid var(--border-color);
  }

  .bubble img.msg-image {
    max-width: 100%;
    max-height: 250px;
    border-radius: var(--radius-sm);
    display: block;
    margin-bottom: 6px;
  }

  .bubble code {
    background: var(--bg-secondary);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: monospace;
    font-size: 13px;
  }
  .bubble pre {
    background: var(--bg-secondary);
    border-radius: var(--radius-sm);
    padding: 10px;
    overflow-x: auto;
    margin: 6px 0;
    font-size: 13px;
  }
  .bubble pre code {
    background: transparent;
    padding: 0;
  }

  .model-tag {
    font-size: 10px;
    color: var(--text-muted);
    margin-bottom: 4px;
    font-weight: 500;
  }

  .typing {
    display: flex;
    gap: 4px;
    padding: 8px 0;
  }
  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  /* ========== ВВОД ========== */
  .input-area {
    flex-shrink: 0;
    padding: 8px 12px;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
    background: var(--bg-primary);
    border-top: 1px solid var(--border-color);
  }

  .image-preview {
    display: flex;
    gap: 8px;
    padding: 4px 0 8px;
    overflow-x: auto;
  }
  .image-preview .item {
    position: relative;
    width: 56px;
    height: 56px;
    border-radius: var(--radius-sm);
    overflow: hidden;
    flex-shrink: 0;
    border: 1px solid var(--border-color);
  }
  .image-preview .item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .image-preview .item .remove {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .input-shell {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    background: var(--bg-input);
    border-radius: var(--radius);
    padding: 4px 4px 4px 12px;
    border: 1px solid var(--border-color);
  }
  .input-shell:focus-within {
    border-color: var(--accent);
  }

  .input-shell textarea {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    resize: none;
    font-size: 15px;
    line-height: 1.4;
    max-height: 100px;
    padding: 8px 0;
    color: var(--text-primary);
    font-family: inherit;
  }
  .input-shell textarea::placeholder {
    color: var(--text-muted);
  }

  .input-btn {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 20px;
    transition: 0.15s;
  }
  .input-btn:active { background: var(--bg-secondary); }

  .input-btn.send {
    background: var(--accent);
    color: white;
  }
  .input-btn.send:active { background: var(--accent-hover); }
  .input-btn.send:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* ========== МОДАЛКА ФОТО ========== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: 0.25s;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }
  .modal-overlay.center {
    align-items: center;
  }

  .modal-sheet {
    background: var(--bg-primary);
    width: 100%;
    max-width: 400px;
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 16px 20px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .modal-overlay.open .modal-sheet {
    transform: translateY(0);
  }
  .modal-overlay.center .modal-sheet {
    border-radius: var(--radius);
    transform: scale(0.9);
    max-width: 320px;
  }
  .modal-overlay.center.open .modal-sheet {
    transform: scale(1);
  }

  .modal-handle {
    width: 40px;
    height: 4px;
    border-radius: 2px;
    background: var(--border-color);
    margin: 0 auto 12px;
  }

  .modal-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 12px;
  }

  .modal-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: 0.15s;
  }
  .modal-option:active { background: var(--bg-secondary); }
  .modal-option .icon { font-size: 24px; }
  .modal-option .text { font-size: 15px; font-weight: 500; }
  .modal-option .sub { font-size: 12px; color: var(--text-muted); }

  /* ========== САЙДБАР ========== */
  .sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: 0.25s;
  }
  .sidebar-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 300px;
    max-width: 80%;
    background: var(--bg-primary);
    z-index: 101;
    transform: translateX(-105%);
    transition: 0.28s cubic-bezier(0.32, 0.72, 0, 1);
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    box-shadow: 4px 0 20px var(--shadow);
  }
  .sidebar.open {
    transform: translateX(0);
  }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 8px;
    border-bottom: 1px solid var(--border-color);
  }
  .sidebar-header .title {
    font-size: 18px;
    font-weight: 700;
  }

  .sidebar-close {
    width: 32px;
    height: 32px;
    border: none;
    background: transparent;
    font-size: 20px;
    cursor: pointer;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sidebar-close:active { background: var(--bg-secondary); }

  .sidebar-nav {
    padding: 8px 12px;
  }
  .sidebar-nav .item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 15px;
    font-weight: 500;
    transition: 0.15s;
  }
  .sidebar-nav .item:active { background: var(--bg-secondary); }
  .sidebar-nav .item .icon { font-size: 18px; }
  .sidebar-nav .item.active { background: var(--bg-secondary); color: var(--accent); }

  .sidebar-divider {
    height: 1px;
    background: var(--border-color);
    margin: 8px 16px;
  }

  .sidebar-chats {
    flex: 1;
    overflow-y: auto;
    padding: 0 12px;
  }
  .sidebar-chats .chat-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    gap: 8px;
  }
  .sidebar-chats .chat-item:active { background: var(--bg-secondary); }
  .sidebar-chats .chat-item .name {
    font-size: 14px;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sidebar-chats .chat-item .del {
    width: 28px;
    height: 28px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 16px;
    cursor: pointer;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sidebar-chats .chat-item .del:active { background: var(--bg-secondary); }

  .sidebar-footer {
    padding: 12px 16px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .sidebar-footer .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    overflow: hidden;
  }
  .sidebar-footer .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .sidebar-footer .info {
    flex: 1;
    overflow: hidden;
  }
  .sidebar-footer .info .name {
    font-size: 14px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sidebar-footer .info .sub {
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ========== WORLD CHAT ========== */
  .world-msg {
    display: flex;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border-color);
  }
  .world-msg .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 12px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .world-msg .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .world-msg .body { flex: 1; }
  .world-msg .body .name {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .world-msg .body .text {
    font-size: 14px;
    word-wrap: break-word;
  }
  .world-msg .body .text img {
    max-width: 150px;
    max-height: 150px;
    border-radius: var(--radius-sm);
    display: block;
    margin-top: 4px;
  }
  .world-msg .time {
    font-size: 10px;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  /* ========== SCROLL ========== */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

  /* ========== АДАПТИВ ========== */
  @media (max-width: 480px) {
    .topbar { padding: 8px 12px; }
    .logo { font-size: 16px; }
    .bubble { max-width: 90%; font-size: 14px; }
    .sidebar { width: 280px; }
  }
</style>
</head>
<body>

<div id="app">
  <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
  <div class="topbar">
    <div class="topbar-left">
      <button class="menu-btn" id="menuBtn">
        <span></span><span></span><span></span>
      </button>
      <div>
        <span class="logo">Fliky</span>
        <span class="logo-sub">AI</span>
      </div>
    </div>
    <div class="topbar-right">
      <span class="model-badge">⚡ Nitro</span>
      <div class="avatar-small" id="avatarBtn">
        <span id="avatarText">?</span>
      </div>
    </div>
  </div>

  <!-- ОСНОВНАЯ ОБЛАСТЬ -->
  <div class="chat-area" id="chatArea">
    <div class="welcome" id="welcome">
      <div class="icon">✨</div>
      <h2 id="greeting">Добро пожаловать!</h2>
      <p>Напиши что-нибудь, чтобы начать общение с Fliky</p>
    </div>
    <div id="messagesContainer"></div>
  </div>

  <!-- ВВОД -->
  <div class="input-area">
    <div class="image-preview" id="imagePreview" style="display:none;"></div>
    <div class="input-shell">
      <button class="input-btn" id="plusBtn">+</button>
      <textarea id="messageInput" rows="1" placeholder="Написать сообщение..."></textarea>
      <button class="input-btn send" id="sendBtn" disabled>➤</button>
    </div>
  </div>
</div>

<!-- ========== МОДАЛКА ВЫБОРА ФОТО ========== -->
<div class="modal-overlay" id="photoModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Прикрепить</div>
    <div class="modal-option" id="galleryOption">
      <span class="icon">🖼️</span>
      <div><div class="text">Из галереи</div><div class="sub">Выбрать фото из галереи</div></div>
    </div>
    <div class="modal-option" id="cameraOption">
      <span class="icon">📷</span>
      <div><div class="text">Сделать фото</div><div class="sub">Сфотографировать на камеру</div></div>
    </div>
  </div>
</div>

<!-- ========== САЙДБАР ========== -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="title">Fliky</span>
    <button class="sidebar-close" id="sidebarClose">✕</button>
  </div>
  <div class="sidebar-nav">
    <div class="item active" id="navChat">
      <span class="icon">💬</span> Чат
    </div>
    <div class="item" id="navWorld">
      <span class="icon">🌍</span> World Chat
    </div>
    <div class="item" id="navNewChat">
      <span class="icon">+</span> Новый чат
    </div>
  </div>
  <div class="sidebar-divider"></div>
  <div class="sidebar-chats" id="sidebarChats"></div>
  <div class="sidebar-footer" id="sidebarFooter">
    <div class="avatar" id="sidebarAvatar">?</div>
    <div class="info">
      <div class="name" id="sidebarName">Гость</div>
      <div class="sub" id="sidebarSub">@username</div>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ========== КОНФИГ ==========
  const BACKEND = 'https://a48794-5d18.e.jrnm.app';
  const WS_URL = BACKEND.replace('https', 'wss') + '/ws/world';

  // ========== TELEGRAM ==========
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.disableVerticalSwipes(); } catch(e) {}
  }

  function getTelegramUser() {
    if (tg?.initDataUnsafe?.user) return tg.initDataUnsafe.user;
    return { id: 8771009385, username: 'dauletbr', first_name: 'Тест', last_name: '', photo_url: null };
  }

  // ========== STATE ==========
  const state = {
    user: null,
    chats: [],
    currentChatId: null,
    messages: [],
    pendingImages: [],
    isWorldChat: false,
    ws: null,
  };

  // ========== DOM ==========
  const $ = id => document.getElementById(id);
  const menuBtn = $('menuBtn');
  const sidebar = $('sidebar');
  const sidebarOverlay = $('sidebarOverlay');
  const sidebarClose = $('sidebarClose');
  const sidebarChats = $('sidebarChats');
  const sidebarAvatar = $('sidebarAvatar');
  const sidebarName = $('sidebarName');
  const sidebarSub = $('sidebarSub');
  const avatarBtn = $('avatarBtn');
  const avatarText = $('avatarText');
  const chatArea = $('chatArea');
  const welcome = $('welcome');
  const greeting = $('greeting');
  const messagesContainer = $('messagesContainer');
  const messageInput = $('messageInput');
  const sendBtn = $('sendBtn');
  const plusBtn = $('plusBtn');
  const photoModal = $('photoModal');
  const galleryOption = $('galleryOption');
  const cameraOption = $('cameraOption');
  const imagePreview = $('imagePreview');
  const navChat = $('navChat');
  const navWorld = $('navWorld');
  const navNewChat = $('navNewChat');

  // ========== УТИЛИТЫ ==========
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function formatTime(iso) {
    try {
      const d = new Date(iso);
      return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    } catch { return ''; }
  }

  function displayName(user) {
    if (!user) return 'Гость';
    const parts = [user.first_name, user.last_name].filter(Boolean);
    return parts.length ? parts.join(' ') : (user.username ? '@' + user.username : 'Гость');
  }

  function initials(user) {
    if (!user) return '?';
    const f = (user.first_name || '')[0] || '';
    const l = (user.last_name || '')[0] || '';
    return (f + l).toUpperCase() || (user.username ? user.username[0].toUpperCase() : '?');
  }

  function scrollBottom() {
    requestAnimationFrame(() => {
      chatArea.scrollTop = chatArea.scrollHeight;
    });
  }

  function haptic(type) {
    if (tg?.HapticFeedback) {
      try { tg.HapticFeedback.impactOccurred(type || 'light'); } catch(e) {}
    }
  }

  // ========== API ==========
  async function apiPost(path, body) {
    const res = await fetch(BACKEND + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, data };
  }

  async function apiGet(path, params) {
    const url = new URL(BACKEND + path);
    if (params) {
      Object.keys(params).forEach(k => {
        if (params[k] !== undefined && params[k] !== null) {
          url.searchParams.set(k, params[k]);
        }
      });
    }
    const res = await fetch(url);
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, data };
  }

  // ========== АВТОРИЗАЦИЯ ==========
  async function auth() {
    const tgUser = getTelegramUser();
    const resp = await apiPost('/api/auth', {
      user_id: tgUser.id,
      username: tgUser.username || null,
      first_name: tgUser.first_name || null,
      last_name: tgUser.last_name || null,
      photo_url: tgUser.photo_url || null,
    });

    if (!resp.ok) {
      greeting.textContent = 'Ошибка подключения';
      return;
    }

    state.user = resp.data.user;
    state.chats = resp.data.chats || [];

    renderSidebar();
    renderUser();

    if (state.chats.length > 0) {
      await openChat(state.chats[0].chat_id);
    }

    updateGreeting();

    // Подключаем World Chat WebSocket
    connectWorldWebSocket();
  }

  function updateGreeting() {
    const hour = new Date().getHours();
    let greet = 'Добрый вечер';
    if (hour >= 5 && hour < 12) greet = 'Доброе утро';
    else if (hour >= 12 && hour < 18) greet = 'Добрый день';
    const name = state.user?.first_name || '';
    greeting.textContent = name ? `${greet}, ${name}!` : `${greet}!`;
  }

  // ========== USER ==========
  function renderUser() {
    if (!state.user) return;
    const av = initials(state.user);
    avatarText.textContent = av;
    if (state.user.photo_url) {
      avatarText.innerHTML = `<img src="${state.user.photo_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
    }
  }

  // ========== SIDEBAR ==========
  function renderSidebar() {
    sidebarName.textContent = displayName(state.user);
    sidebarSub.textContent = state.user?.username ? '@' + state.user.username : 'Пользователь';
    const av = initials(state.user);
    sidebarAvatar.textContent = av;
    if (state.user?.photo_url) {
      sidebarAvatar.innerHTML = `<img src="${state.user.photo_url}" style="width:100%;height:100%;object-fit:cover;">`;
    }

    renderChatsList();
  }

  function renderChatsList() {
    sidebarChats.innerHTML = '';
    if (!state.chats || state.chats.length === 0) {
      sidebarChats.innerHTML = '<div style="padding:12px;color:var(--text-muted);font-size:13px;">Нет чатов</div>';
      return;
    }

    state.chats.forEach(chat => {
      const div = document.createElement('div');
      div.className = 'chat-item';
      if (chat.chat_id === state.currentChatId) {
        div.style.background = 'var(--bg-secondary)';
      }

      const nameSpan = document.createElement('span');
      nameSpan.className = 'name';
      nameSpan.textContent = chat.title || 'Новый чат';

      const delBtn = document.createElement('button');
      delBtn.className = 'del';
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteChat(chat.chat_id);
      });

      div.appendChild(nameSpan);
      div.appendChild(delBtn);

      div.addEventListener('click', () => {
        closeSidebar();
        if (!state.isWorldChat) {
          openChat(chat.chat_id);
        } else {
          state.isWorldChat = false;
          navChat.classList.add('active');
          navWorld.classList.remove('active');
          openChat(chat.chat_id);
        }
      });

      sidebarChats.appendChild(div);
    });
  }

  function toggleSidebar() {
    sidebar.classList.toggle('open');
    sidebarOverlay.classList.toggle('open');
    haptic('light');
  }

  function closeSidebar() {
    sidebar.classList.remove('open');
    sidebarOverlay.classList.remove('open');
  }

  menuBtn.addEventListener('click', toggleSidebar);
  sidebarClose.addEventListener('click', closeSidebar);
  sidebarOverlay.addEventListener('click', closeSidebar);

  // ========== НАВИГАЦИЯ ==========
  navChat.addEventListener('click', () => {
    closeSidebar();
    state.isWorldChat = false;
    navChat.classList.add('active');
    navWorld.classList.remove('active');
    if (state.currentChatId) {
      openChat(state.currentChatId);
    } else if (state.chats.length > 0) {
      openChat(state.chats[0].chat_id);
    } else {
      createNewChat();
    }
  });

  navWorld.addEventListener('click', () => {
    closeSidebar();
    state.isWorldChat = true;
    navWorld.classList.add('active');
    navChat.classList.remove('active');
    welcome.style.display = 'none';
    messagesContainer.innerHTML = '';
    renderWorldMessages();
  });

  navNewChat.addEventListener('click', () => {
    closeSidebar();
    createNewChat();
  });

  // ========== ЧАТЫ ==========
  async function openChat(chatId) {
    state.currentChatId = chatId;
    state.isWorldChat = false;
    navChat.classList.add('active');
    navWorld.classList.remove('active');

    const resp = await apiGet('/api/chats/' + chatId + '/messages', { user_id: state.user.user_id });
    if (!resp.ok) return;

    state.messages = resp.data.messages || [];
    renderMessages();
    renderChatsList();
    scrollBottom();
  }

  async function createNewChat() {
    const resp = await apiPost('/api/chats/create', {
      user_id: state.user.user_id,
    });
    if (resp.ok) {
      state.chats.unshift(resp.data.chat);
      state.currentChatId = resp.data.chat.chat_id;
      state.messages = [];
      renderMessages();
      renderChatsList();
      closeSidebar();
      scrollBottom();
    }
  }

  async function deleteChat(chatId) {
    const resp = await apiPost('/api/chats/delete', {
      user_id: state.user.user_id,
      chat_id: chatId,
    });
    if (resp.ok) {
      state.chats = resp.data.chats || [];
      renderChatsList();
      if (chatId === state.currentChatId) {
        if (state.chats.length > 0) {
          openChat(state.chats[0].chat_id);
        } else {
          state.currentChatId = null;
          state.messages = [];
          renderMessages();
        }
      }
    }
  }

  // ========== СООБЩЕНИЯ ==========
  function renderMessages() {
    messagesContainer.innerHTML = '';
    if (!state.messages || state.messages.length === 0) {
      welcome.style.display = 'flex';
      return;
    }
    welcome.style.display = 'none';

    state.messages.forEach(msg => {
      messagesContainer.appendChild(buildMessage(msg));
    });
    scrollBottom();
  }

  function buildMessage(msg) {
    const row = document.createElement('div');
    row.className = 'message-row ' + (msg.role === 'user' ? 'user' : 'assistant');

    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (msg.role === 'user' ? 'user' : 'assistant');

    if (msg.role === 'assistant') {
      const tag = document.createElement('div');
      tag.className = 'model-tag';
      tag.textContent = 'Fliky 3.6 Nitro';
      bubble.appendChild(tag);
    }

    if (msg.image_data) {
      const img = document.createElement('img');
      img.className = 'msg-image';
      img.src = msg.image_data;
      bubble.appendChild(img);
    }

    if (msg.content) {
      const div = document.createElement('div');
      div.innerHTML = renderMarkdown(msg.content);
      bubble.appendChild(div);
    }

    row.appendChild(bubble);
    return row;
  }

  function renderMarkdown(text) {
    let html = escapeHtml(text);
    // Код-блоки
    html = html.replace(/```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
      return '<pre><code>' + code.replace(/\n$/, '') + '</code></pre>';
    });
    // Инлайн-код
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    // Жирный
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    return html;
  }

  // ========== ОТПРАВКА ==========
  async function sendMessage() {
    const text = messageInput.value.trim();
    const images = state.pendingImages.slice();

    if (!text && images.length === 0) return;
    if (state.isWorldChat) {
      await sendWorldMessage(text, images);
      return;
    }

    // Проверяем, есть ли чат
    if (!state.currentChatId) {
      await createNewChat();
      if (!state.currentChatId) return;
    }

    haptic('light');
    const userMsg = {
      role: 'user',
      content: text,
      image_data: images.length > 0 ? images[0] : null,
    };
    state.messages.push(userMsg);
    renderMessages();

    messageInput.value = '';
    messageInput.style.height = 'auto';
    clearImages();
    sendBtn.disabled = true;

    // Индикатор печати
    const typing = document.createElement('div');
    typing.className = 'message-row assistant';
    typing.innerHTML = '<div class="bubble assistant"><div class="typing"><span></span><span></span><span></span></div></div>';
    messagesContainer.appendChild(typing);
    scrollBottom();

    const resp = await apiPost('/api/send', {
      user_id: state.user.user_id,
      chat_id: state.currentChatId,
      text: text,
      image_base64: images.length > 0 ? images[0] : null,
    });

    typing.remove();

    if (!resp.ok) {
      const errMsg = {
        role: 'assistant',
        content: '⚠️ Ошибка: ' + (resp.data?.message || 'Попробуйте ещё раз'),
      };
      state.messages.push(errMsg);
      renderMessages();
      sendBtn.disabled = false;
      return;
    }

    // Обновляем сообщения
    await openChat(state.currentChatId);
    sendBtn.disabled = false;
    haptic('success');
  }

  // ========== WORLD CHAT ==========
  function connectWorldWebSocket() {
    if (state.ws) return;
    try {
      state.ws = new WebSocket(WS_URL);
      state.ws.onmessage = (event) => {
        if (state.isWorldChat) {
          const data = JSON.parse(event.data);
          if (data.type === 'new_message' && data.message) {
            renderWorldMessage(data.message);
          }
        }
      };
      state.ws.onclose = () => {
        state.ws = null;
        setTimeout(connectWorldWebSocket, 3000);
      };
    } catch(e) {
      console.error('WebSocket error:', e);
    }
  }

  async function sendWorldMessage(text, images) {
    haptic('light');
    const resp = await apiPost('/api/world/send', {
      user_id: state.user.user_id,
      text: text,
      image_base64: images.length > 0 ? images[0] : null,
    });

    messageInput.value = '';
    clearImages();
    sendBtn.disabled = true;

    if (resp.ok && state.ws) {
      // Отправляем через WebSocket для мгновенного обновления
      state.ws.send(JSON.stringify({
        type: 'new_message',
        message: resp.data.message,
        user: state.user,
      }));
    }

    // Перезагружаем сообщения
    await loadWorldMessages();
    sendBtn.disabled = false;
    haptic('success');
  }

  async function loadWorldMessages() {
    const resp = await apiGet('/api/world/messages', { limit: 100 });
    if (resp.ok) {
      renderWorldMessages(resp.data.messages);
    }
  }

  function renderWorldMessages(messages) {
    messagesContainer.innerHTML = '';
    welcome.style.display = 'none';
    if (state.isWorldChat) {
      if (!messages) {
        loadWorldMessages();
        return;
      }
      messages.forEach(msg => renderWorldMessage(msg));
      scrollBottom();
    }
  }

  function renderWorldMessage(msg) {
    const div = document.createElement('div');
    div.className = 'world-msg';

    const avatarDiv = document.createElement('div');
    avatarDiv.className = 'avatar';
    const av = (msg.first_name ? msg.first_name[0] : '?').toUpperCase();
    if (msg.photo_url) {
      avatarDiv.innerHTML = `<img src="${msg.photo_url}">`;
    } else {
      avatarDiv.textContent = av;
    }

    const body = document.createElement('div');
    body.className = 'body';

    const nameDiv = document.createElement('div');
    nameDiv.className = 'name';
    nameDiv.textContent = displayName(msg);

    const textDiv = document.createElement('div');
    textDiv.className = 'text';
    textDiv.innerHTML = escapeHtml(msg.content || '');
    if (msg.image_data) {
      const img = document.createElement('img');
      img.src = msg.image_data;
      textDiv.appendChild(img);
    }

    body.appendChild(nameDiv);
    body.appendChild(textDiv);

    const timeDiv = document.createElement('div');
    timeDiv.className = 'time';
    timeDiv.textContent = formatTime(msg.created_at);

    div.appendChild(avatarDiv);
    div.appendChild(body);
    div.appendChild(timeDiv);

    messagesContainer.appendChild(div);
  }

  // ========== ФОТО ==========
  function showPhotoModal() {
    photoModal.classList.add('open');
    haptic('light');
  }

  function closePhotoModal() {
    photoModal.classList.remove('open');
  }

  photoModal.addEventListener('click', (e) => {
    if (e.target === photoModal) closePhotoModal();
  });

  galleryOption.addEventListener('click', () => {
    closePhotoModal();
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = (e) => {
      if (e.target.files && e.target.files[0]) {
        handleFile(e.target.files[0]);
      }
    };
    input.click();
  });

  cameraOption.addEventListener('click', () => {
    closePhotoModal();
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.capture = 'environment';
    input.onchange = (e) => {
      if (e.target.files && e.target.files[0]) {
        handleFile(e.target.files[0]);
      }
    };
    input.click();
  });

  plusBtn.addEventListener('click', showPhotoModal);

  function handleFile(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      state.pendingImages.push(e.target.result);
      renderImagePreview();
      updateSendBtn();
    };
    reader.readAsDataURL(file);
  }

  function renderImagePreview() {
    if (state.pendingImages.length === 0) {
      imagePreview.style.display = 'none';
      imagePreview.innerHTML = '';
      return;
    }
    imagePreview.style.display = 'flex';
    imagePreview.innerHTML = '';
    state.pendingImages.forEach((data, idx) => {
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `
        <img src="${data}">
        <button class="remove" data-idx="${idx}">✕</button>
      `;
      div.querySelector('.remove').addEventListener('click', () => {
        state.pendingImages.splice(idx, 1);
        renderImagePreview();
        updateSendBtn();
      });
      imagePreview.appendChild(div);
    });
  }

  function clearImages() {
    state.pendingImages = [];
    renderImagePreview();
  }

  function updateSendBtn() {
    const hasText = messageInput.value.trim().length > 0;
    const hasImage = state.pendingImages.length > 0;
    sendBtn.disabled = !(hasText || hasImage);
  }

  messageInput.addEventListener('input', () => {
    messageInput.style.height = 'auto';
    messageInput.style.height = Math.min(messageInput.scrollHeight, 100) + 'px';
    updateSendBtn();
  });

  messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  // ========== ЗАПУСК ==========
  auth();

})();
</script>
</body>
</html>
