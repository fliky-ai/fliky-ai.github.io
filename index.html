<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0E1218">
<title>Мессенджер</title>
<script>try{var t=localStorage.getItem("theme");if(t&&t!=="auto")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<!-- ВХОД -->
<section id="auth" class="auth hidden">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 3.5 10.5 14"/><path d="M21.5 3.5 14.5 21l-4-7-7-4z"/></svg></div>
  <div id="step-phone" class="step">
    <h1>Ваш номер</h1>
    <p class="sub">Введите номер, который выдал бот. Код для входа придёт в этот же бот.</p>
    <input id="phone" class="big-input" type="tel" inputmode="tel" autocomplete="off" value="+888" placeholder="+888 0000 0000">
    <button id="btn-phone" class="btn">Продолжить</button>
    <p class="hint">Нет номера? Откройте бота и отправьте /start</p>
  </div>
  <div id="step-code" class="step hidden">
    <h1>Код из бота</h1>
    <p class="sub">Мы отправили код в Telegram для номера <b id="code-num"></b></p>
    <input id="code" class="big-input code" type="text" inputmode="numeric" maxlength="5" autocomplete="one-time-code" placeholder="•••••">
    <button id="resend" class="link" disabled></button>
    <button id="change-num" class="link">Изменить номер</button>
  </div>
  <p id="auth-err" class="err" role="alert"></p>
</section>

<!-- ПРИЛОЖЕНИЕ -->
<main id="app" class="hidden">
  <div id="conn" class="conn">Соединение…</div>
  <div class="views">
    <section class="view active" id="v-chats">
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="chat-q" placeholder="Поиск" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button id="chat-q-clear" class="clear hidden" aria-label="Очистить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></label>
      <div class="scroll" id="chat-list"></div>
    </section>
    <section class="view" id="v-contacts"><div class="scroll" id="contact-list"></div></section>
    <section class="view" id="v-settings"><div class="scroll" id="settings-box"></div></section>
    <section class="view" id="v-profile"><div class="scroll" id="profile-box"></div></section>
  </div>
  <nav class="tabbar">
    <button class="tab active" data-tab="chats" aria-label="Чаты"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8.5 8.5 0 0 1-12.4 7.5L3 21l1.6-5.3A8.5 8.5 0 1 1 21 12z"/></svg><i id="tab-badge" class="dot hidden"></i></button>
    <button class="tab" data-tab="contacts" aria-label="Контакты"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"/><path d="M18.5 14a6.5 6.5 0 0 1 3 6"/></svg></button>
    <button class="tab" data-tab="settings" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <button class="tab" data-tab="profile" aria-label="Профиль"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="10" r="3"/><path d="M6.2 18.6a6.5 6.5 0 0 1 11.6 0"/></svg></button>
  </nav>
</main>

<!-- ЧАТ -->
<section id="chat" class="page" aria-hidden="true">
  <header class="phead">
    <button id="chat-back" class="icon-btn" aria-label="Назад"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <button id="chat-head" class="headinfo"><span id="chat-av"></span><span class="cinfo"><span id="chat-name" class="name"></span><span id="chat-sub" class="sub2"></span></span></button>
  </header>
  <div id="msgs" class="msgs"></div>
  <div id="composer" class="composer">
    <div class="field"><textarea id="msg-input" rows="1" placeholder="Сообщение" enterkeyhint="send"></textarea></div>
    <button id="send" class="send" aria-label="Отправить"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></button>
  </div>
</section>

<!-- ПРОФИЛЬ СОБЕСЕДНИКА -->
<section id="uprofile" class="page" aria-hidden="true">
  <header class="phead"><button id="up-back" class="icon-btn" aria-label="Назад"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button><div class="ptitle">Профиль</div></header>
  <div class="scroll" id="up-body"></div>
</section>

<!-- РЕДАКТИРОВАНИЕ ПРОФИЛЯ -->
<section id="editprof" class="page" aria-hidden="true">
  <header class="phead"><button id="ed-back" class="icon-btn" aria-label="Назад"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button><div class="ptitle">Изменить профиль</div><button id="ed-save" class="link save" disabled>Готово</button></header>
  <div class="scroll">
    <div class="phero"><button id="ed-av" class="avbtn" aria-label="Сменить фото"></button></div>
    <div class="group form">
      <label>Имя<input id="ed-name" maxlength="64" autocomplete="off" placeholder="Как вас зовут"></label>
      <label>Имя пользователя<input id="ed-user" maxlength="32" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="username"></label>
      <div id="ed-user-hint" class="hint2">От 5 до 32 символов: латиница, цифры и _. Начинается с буквы.</div>
      <label>О себе<textarea id="ed-bio" rows="2" maxlength="70" placeholder="Пара слов о себе"></textarea></label>
      <div id="ed-bio-cnt" class="hint2 right">0/70</div>
    </div>
  </div>
</section>

<input id="file" type="file" accept="image/*" hidden>
<div id="ctx" class="ctx hidden"><button id="ctx-copy">Копировать</button></div>
<div id="sheet" class="sheet hidden"><div class="card"><p id="sheet-t"></p><div class="sheet-btns"><button id="sheet-no">Отмена</button><button id="sheet-ok" class="danger">Выйти</button></div></div></div>
<div id="toast" class="toast"></div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="register.js"></script>
<script src="chats.js"></script>
<script src="chat.js"></script>
<script src="contacts.js"></script>
<script src="userprofile.js"></script>
<script src="profile.js"></script>
<script src="settings.js"></script>
<script src="app.js"></script>
</body>
</html>
